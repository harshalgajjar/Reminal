      background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2024%2024%27%20width%3D%2726%27%20height%3D%2726%27%3E%3Cpath%20d%3D%27M6.2%2011V9.6a1.4%201.4%200%200%201%202.8%200V9a1.4%201.4%200%200%201%202.8%200v.3a1.4%201.4%200%200%201%202.8%200v.5a1.4%201.4%200%200%201%202.8%200V15a5%205%200%200%201-5%205h-1.8a5%205%200%200%201-4.7-3.3l-1.3-3.6a1.35%201.35%200%200%201%202.45-1.1l.6%201.2Z%27%20fill%3D%27white%27%20stroke%3D%27black%27%20stroke-width%3D%271.5%27%20stroke-linejoin%3D%27round%27%20stroke-linecap%3D%27round%27%2F%3E%3C%2Fsvg%3E");
      transform-origin: center;
      transform: translate(-9px, -10px) scale(1.08);
      filter: drop-shadow(0 0 3px rgba(56, 139, 253, 0.95)) drop-shadow(0 1px 1.5px rgba(0, 0, 0, 0.5));
    }
    /* Shown when a pane stops receiving frames — e.g. the host screen is locked
       or asleep, which blocks capture. Turns a silent freeze into a clear cue. */
    .wpane-stall {
      /* The pane body is line-height 0 so the video sits flush; without this a
         message long enough to wrap drew every line on top of the last. */
      line-height: 1.4;
      position: absolute; inset: 0; z-index: 4; display: none;
      align-items: center; justify-content: center;
      background: rgba(13, 17, 23, 0.5); backdrop-filter: blur(2px);
    }
    .wpane.stalled .wpane-stall { display: flex; }
    .wpane-stall .pill {
      display: flex; align-items: center; gap: 9px; max-width: 92%;
      background: rgba(22, 27, 34, 0.96); border: 1px solid #30363d; color: #e6edf3;
      font-size: 13px; padding: 8px 14px; border-radius: 18px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
    }
    .wpane-stall .dot {
      width: 9px; height: 9px; border-radius: 50%; background: #d29922; flex: none;
      animation: stallpulse 1.2s ease-in-out infinite;
    }
    .wpane-stall .sub { color: #8b949e; font-size: 11px; }
    @keyframes stallpulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    /* Capture error (vs a transient stall): steady red dot, no pulse. */
    .wpane.stall-error .wpane-stall .dot { background: #f85149; animation: none; }
    .wpane.stall-error .wpane-stall .pill { border-color: #f85149; }
    /* Loading spinner shown until a pane's first frame arrives, so opening a
       window reads as "connecting" instead of a blank black box. */
    .wpane-load {
      position: absolute; inset: 0; z-index: 4; display: none;
      flex-direction: column; align-items: center; justify-content: center; gap: 11px;
      background: rgba(13, 17, 23, 0.6); backdrop-filter: blur(2px);
    }
    .wpane.loading .wpane-load { display: flex; }
    .wpane-spin {
      width: 26px; height: 26px; border-radius: 50%;
      border: 3px solid rgba(139, 148, 158, 0.3); border-top-color: #58a6ff;
      animation: wpspin 0.8s linear infinite;
    }
    @keyframes wpspin { to { transform: rotate(360deg); } }
    .wpane-loadmsg { color: #adbac7; font-size: 12px; line-height: 1.4; text-align: center; max-width: 82%; }
    .wpane-loadmsg .sub { display: block; color: #8b949e; font-size: 11px; margin-top: 3px; }
    /* Transport/details popover toggled by the (i) button in a pane's titlebar. */
    .wpane-info {
      position: absolute; top: 40px; right: 8px; z-index: 6; display: none;
      background: rgba(22, 27, 34, 0.98); border: 1px solid #30363d; border-radius: 8px;
      padding: 9px 11px; font-size: 11.5px; color: #c9d1d9; min-width: 184px;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.5); cursor: default;
    }
    .wpane-info.show { display: block; }
    .wpane-info .row { display: flex; justify-content: space-between; gap: 16px; padding: 2px 0; }
    .wpane-info .k { color: #8b949e; }
    .wpane-info .v { color: #e6edf3; font-weight: 500; }
    .wpane-info .v.p2p { color: #3fb950; }
    .wpane-info .v.turn { color: #d29922; }
    .wpane-info .v.ws { color: #f0883e; }
    .wpane-info .v.warn { color: #f85149; }
    /* Warning banner atop the Windows dropdown (e.g. Screen Recording is off). */
    .windows-hint {
      margin: 6px; padding: 8px 10px; border-radius: 6px; font-size: 11.5px; line-height: 1.6;
      background: rgba(187, 128, 9, 0.15); border: 1px solid rgba(187, 128, 9, 0.5); color: #e3b341;
    }
    .windows-hint .cmd {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px;
      background: rgba(0, 0, 0, 0.35); color: #e6edf3; padding: 1px 5px; border-radius: 4px; white-space: nowrap;
    }
    .windows-hint .copy-cmd {
      margin-left: 5px; font-size: 10.5px; padding: 2px 8px; cursor: pointer; vertical-align: baseline;
      background: #21262d; color: #adbac7; border: 1px solid #30363d; border-radius: 4px;
    }
    .windows-hint .copy-cmd:hover { background: #30363d; color: #e6edf3; }
    .windows-note { padding: 12px; color: #8b949e; font-size: 12px; line-height: 1.5; }
    /* Search box atop a long panel list — Apps, Windows, and Machines. */
    .panel-search {
      width: calc(100% - 12px); margin: 6px; padding: 7px 9px; box-sizing: border-box;
      background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
      color: #e6edf3; font-size: 12.5px; outline: none;
      -webkit-appearance: none; appearance: none;
      /* Inherited by the ::-webkit-search-cancel-button pseudo-element below. */
      --x-glyph: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M4 4l8 8M12 4l-8 8' stroke='%23000' stroke-width='2.2' stroke-linecap='round'/></svg>");
    }
    .panel-search:focus { border-color: #388bfd; }
    /* The stock type=search clear button is a blue-gradient bubble that belongs
       to no part of this UI. Replace it with a plain gray ✕: the glyph is a mask
       so `background` is the actual colour, which lets it brighten on hover
       instead of staying a fixed-colour image. */
    .panel-search::-webkit-search-cancel-button {
      -webkit-appearance: none; appearance: none;
      height: 11px; width: 11px; cursor: pointer; background: #6e7681;
      -webkit-mask: var(--x-glyph) center / contain no-repeat;
      mask: var(--x-glyph) center / contain no-repeat;
    }
    .panel-search::-webkit-search-cancel-button:hover { background: #adbac7; }
    .panel-rows { max-height: 46vh; overflow-y: auto; }
    /* Hidden by a search that didn't match. Separate from every other reason a
       row can be invisible (collapsed card, pending revoke) so the filter can be
       cleared without having to know what those were. */
    .filter-hide { display: none !important; }
    /* A collapsed machine card still reveals the sessions a search matched —
       otherwise typing a session name appears to find nothing. */
    .machine-box.filter-open .machine-sessions.collapsed { display: block; }
    /* Nothing to search yet: no machines, no recents, no query. */
    .panel-search.is-idle { display: none; }
    /* ── Guided tour ──────────────────────────────────────────────────────
       A spotlight that glides from control to control, and a card that
       follows it. It borrows reminal.app's look: Geist, monochrome,
       hairline borders, mono eyebrows, colour only where it means something.
       Everything is fixed-position above the app (the header is z 50, the
       share modal 100), and the tour owns input while it runs: a transparent
       blocker eats clicks so a stray tap cannot open a menu out from under a
       step. Geist comes from the same CDN as xterm.js, so the viewer gains
       no new third party. */
    @font-face { font-family: "Tour Geist"; src: url(https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/Geist-Variable.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: "Tour Geist Mono"; src: url(https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/GeistMono-Variable.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
    .tour-card, .tour-mock {
      --t-sans: "Tour Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --t-mono: "Tour Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --t-panel: #0a0a0a; --t-soft: #111; --t-ink: #ededed; --t-dim: #a1a1a1; --t-mute: #7d7d7d;
      --t-line: #1f1f1f; --t-line2: #2e2e2e; --t-yes: #62c073;
    }

    .tour-block { position: fixed; inset: 0; z-index: 9000; background: transparent; touch-action: none; }
    /* The spotlight is only a hole in the dim: no outline, no glow. */
    .tour-ring {
      position: fixed; z-index: 9002; pointer-events: none; border-radius: 10px;
      box-shadow: 0 0 0 200vmax rgba(0, 0, 0, 0.72);
      transition: left .55s cubic-bezier(.2,.7,.2,1), top .55s cubic-bezier(.2,.7,.2,1),
                  width .55s cubic-bezier(.2,.7,.2,1), height .55s cubic-bezier(.2,.7,.2,1),
                  box-shadow .4s ease;
    }
    .tour-ring.intro { box-shadow: 0 0 0 200vmax rgba(0, 0, 0, 0); }

    .tour-card {
      position: fixed; z-index: 9003; width: 360px; max-width: calc(100vw - 24px); overflow: hidden;
      background: var(--t-panel); border: 1px solid var(--t-line2); border-radius: 12px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      color: var(--t-ink); font: 400 14px/1.55 var(--t-sans); letter-spacing: -.006em;
      -webkit-font-smoothing: antialiased;
      transition: left .5s cubic-bezier(.2,.7,.2,1), top .5s cubic-bezier(.2,.7,.2,1), opacity .3s ease;
      -webkit-user-select: none; user-select: none; touch-action: pan-y;
    }
    .tour-card.hero { width: 480px; }
    .tour-card .tour-bar { height: 1px; margin: 0 14px; background: var(--t-line); }
    .tour-card .tour-bar i { display: block; height: 100%; width: 0; background: var(--t-ink); transition: width .5s cubic-bezier(.2,.7,.2,1); }
    .tour-card .tour-in { position: relative; padding: 18px 20px 16px; }
    .tour-card.hero .tour-in { padding: 30px 30px 24px; }
    .tour-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .tour-ico {
      flex: none; width: 32px; height: 32px; display: grid; place-items: center; color: var(--t-ink);
      background: var(--t-soft); border: 1px solid var(--t-line2); border-radius: 8px;
    }
    .tour-ico svg { width: 17px; height: 17px; }
    .tour-count { font: 500 12px var(--t-mono); color: var(--t-ink); letter-spacing: .02em; }
    .tour-count span { color: var(--t-mute); }
    .tour-x {
      margin-left: auto; background: transparent; border: none; padding: 4px 2px;
      font: 400 13px var(--t-sans); color: var(--t-mute);
    }
    .tour-x:hover { background: transparent; color: var(--t-ink); }
    .tour-title { font: 600 18px/1.3 var(--t-sans); letter-spacing: -.025em; margin-bottom: 6px; }
    .tour-body { color: var(--t-dim); }
    .tour-body b { color: var(--t-ink); font-weight: 500; }
    .tour-body b.ok { color: var(--t-yes); }
    .tour-body b.warn { color: #f2a20d; }
    .tour-card kbd, .tour-body code {
      font: 500 12px var(--t-mono); color: var(--t-ink);
      background: var(--t-soft); border: 1px solid var(--t-line2); border-radius: 5px; padding: 1px 5px;
    }
    /* A control named mid-sentence: its real glyph on a key cap. */
    .tour-k {
      display: inline-grid; place-items: center; width: 20px; height: 20px; vertical-align: -5px;
      background: var(--t-soft); border: 1px solid var(--t-line2); border-radius: 5px; color: var(--t-ink);
    }
    .tour-k svg { width: 12px; height: 12px; }
    .tour-tips { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
    .tour-tips li { display: flex; gap: 10px; align-items: baseline; color: var(--t-dim); font-size: 13.5px; }
    .tour-tips li::before { content: ''; flex: none; width: 4px; height: 4px; border-radius: 50%; background: var(--t-mute); transform: translateY(-3px); }
    .tour-note {
      display: flex; gap: 10px; align-items: center; margin-top: 14px; padding-top: 12px;
      border-top: 1px solid var(--t-line); font-size: 12.5px; color: var(--t-mute); line-height: 1.45;
    }
    .tour-chip, .tm-tag {
      flex: none; font: 500 10.5px var(--t-mono); letter-spacing: .06em; text-transform: uppercase;
      color: var(--t-dim); border: 1px solid var(--t-line2); border-radius: 5px; padding: 2px 7px; background: var(--t-soft);
    }
    .tour-foot { display: flex; align-items: center; gap: 8px; margin-top: 18px; }
    .tour-dots { display: flex; gap: 5px; flex-wrap: wrap; margin-right: auto; }
    .tour-dots button {
      width: 6px; height: 6px; padding: 0; border-radius: 50%; background: var(--t-line2); border: none;
      transition: background .25s ease, transform .25s ease;
    }
    .tour-dots button:hover { background: var(--t-mute); }
    .tour-dots button.seen { background: #4d4d4d; }
    .tour-dots button.on { background: var(--t-ink); transform: scale(1.15); }
    .tour-btn2, .tour-btn1 {
      height: 34px; padding: 0 14px; border-radius: 6px; font: 500 13.5px var(--t-sans); letter-spacing: -.01em;
      display: inline-flex; align-items: center; gap: 6px; transition: background .15s, border-color .15s, color .15s;
    }
    .tour-btn2 { background: transparent; border: 1px solid var(--t-line2); color: var(--t-dim); }
    .tour-btn2:hover { background: var(--t-soft); color: var(--t-ink); border-color: #3d3d3d; }
    .tour-btn1 { background: var(--t-ink); border: 1px solid var(--t-ink); color: #0a0a0a; }
    .tour-btn1:hover { background: #fff; }
    .tour-btn1:focus-visible, .tour-btn2:focus-visible { outline: 2px solid #52a8ff; outline-offset: 2px; }
    .tour-btn1 svg { width: 15px; height: 15px; transition: transform .2s ease; }
    .tour-btn1:hover svg { transform: translateX(2px); }
    .tour-arrow {
      position: absolute; width: 12px; height: 12px; background: var(--t-panel); transform: rotate(45deg);
      border: 1px solid var(--t-line2); transition: left .5s cubic-bezier(.2,.7,.2,1); z-index: 1;
    }
    .tour-arrow.up { top: -7px; border-right: none; border-bottom: none; }
    .tour-arrow.down { bottom: -7px; border-left: none; border-top: none; }
    .tour-arrow.none { display: none; }
    .tour-card:has(.tour-arrow:not(.none)) { overflow: visible; }

    /* Welcome + finale: reminal.app's hero in miniature. */
    .tour-grid {
      position: absolute; inset: 0 0 auto; height: 220px; pointer-events: none;
      background-image: linear-gradient(var(--t-line) 1px, transparent 1px), linear-gradient(90deg, var(--t-line) 1px, transparent 1px);
      background-size: 32px 32px; background-position: center top;
      -webkit-mask-image: radial-gradient(ellipse 80% 90% at 30% 0%, #000 15%, transparent 75%);
      mask-image: radial-gradient(ellipse 80% 90% at 30% 0%, #000 15%, transparent 75%);
    }
    .tour-card.hero .tour-in > :not(.tour-grid) { position: relative; }
    .tour-eyebrow { font: 500 11.5px var(--t-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--t-mute); margin-bottom: 12px; }
    .tour-card.hero .tour-title { font-size: 30px; line-height: 1.08; letter-spacing: -.045em; color: var(--t-mute); margin-bottom: 12px; }
    .tour-card.hero .tour-title .em { color: var(--t-ink); }
    .tour-card.hero .tour-body { font-size: 15px; }
    .tour-fig {
      margin-top: 20px; background: #0a0a0a; border: 1px solid var(--t-line2); border-radius: 10px; overflow: hidden;
      font: 400 12.5px/1.7 var(--t-mono); color: var(--t-ink);
    }
    .tour-figbar { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; background: #111; border-bottom: 1px solid var(--t-line); }
    .tour-figbar i { width: 9px; height: 9px; border-radius: 50%; background: #2e2e2e; }
    .tour-figbar span { flex: 1; text-align: center; margin-right: 33px; font-size: 11px; color: var(--t-mute); }
    .tour-figbody { padding: 12px 14px 14px; min-height: 92px; }
    .tour-figbody .p { color: var(--t-mute); }
    .tour-figbody .ok { color: var(--t-yes); }
    .tour-figbody .out { color: var(--t-dim); opacity: 0; animation: tour-in .3s ease forwards; }
    .tour-figbody .o1 { animation-delay: 1.5s; }
    .tour-figbody .o2 { animation-delay: 1.8s; }
    .tour-figbody .typed { display: inline-block; vertical-align: bottom; overflow: hidden; white-space: nowrap; width: 0; animation: tour-type .9s steps(11) .4s forwards; }
    .tour-figbody .cur { display: inline-block; width: 7px; height: 14px; margin-left: 2px; vertical-align: -2px; background: var(--t-ink); animation: tour-blink 1s steps(1) infinite; }
    @keyframes tour-type { to { width: 11ch; } }
    @keyframes tour-in { to { opacity: 1; } }
    @keyframes tour-blink { 50% { opacity: 0; } }
    .tour-stats { display: flex; margin-top: 14px; border: 1px solid var(--t-line2); border-radius: 10px; overflow: hidden; }
    .tour-stats div { flex: 1; padding: 12px 14px 11px; border-left: 1px solid var(--t-line2); }
    .tour-stats div:first-child { border-left: none; }
    .tour-stats b { display: block; font: 600 20px/1 var(--t-sans); letter-spacing: -.04em; color: var(--t-ink); }
    .tour-stats b span { font: 500 11px var(--t-mono); color: var(--t-mute); margin-left: 2px; letter-spacing: 0; }
    .tour-stats em { display: block; margin-top: 6px; font: 400 11px var(--t-mono); font-style: normal; color: var(--t-mute); }
    .tour-card.hero .tour-foot { margin-top: 22px; }
    .tour-card.hero .tour-foot .tour-btn2 { margin-left: auto; }
    .tour-hint { margin-top: 14px; font: 400 11px var(--t-mono); color: var(--t-mute); }
    .tour-hint kbd { font-size: 10.5px; padding: 0 4px; }
    @media (pointer: coarse) { .tour-hint.keys { display: none; } }
    .tour-done-check { width: 44px; height: 44px; margin-bottom: 16px; }
    .tour-done-check .arc { stroke-dasharray: 140; stroke-dashoffset: 140; transform: rotate(-90deg); transform-origin: center; animation: tour-draw .8s cubic-bezier(.2,.7,.2,1) forwards; }
    .tour-done-check path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: tour-draw .4s .6s ease forwards; }
    @keyframes tour-draw { to { stroke-dashoffset: 0; } }
    .tour-confetti { position: fixed; inset: 0; z-index: 9004; pointer-events: none; }

    /* Example panels: what a menu looks like once it has things in it,
       standing in for the real one, which a new user has nothing in yet.
       Drawn in the app's own dropdown style so they read as the real menu. */
    .tour-mock {
      position: fixed; z-index: 9001; pointer-events: none;
      background: #161b22; border: 1px solid #30363d; border-radius: 6px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      padding: 8px; font-size: 13px; color: #e6edf3; transition: opacity .2s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .tour-mock svg { width: 14px; height: 14px; flex: none; }
    .tm-tag { position: absolute; top: -11px; right: 10px; background: #0a0a0a; }
    .tm-bar { display: flex; gap: 6px; margin-bottom: 6px; }
    .tm-search {
      flex: 1; display: flex; align-items: center; gap: 7px; padding: 6px 9px; border-radius: 6px;
      background: #0d1117; border: 1px solid #30363d; color: #6e7681;
    }
    .tm-bell { width: 32px; display: grid; place-items: center; border: 1px solid #30363d; border-radius: 6px; background: #0d1117; color: #c9d1d9; }
    .tm-mach { display: flex; align-items: center; gap: 8px; padding: 8px 6px 4px; }
    .tm-mach b { font-weight: 600; }
    .tm-mach.off { color: #8b949e; }
    .tm-sub { color: #8b949e; font-size: 11px; font-family: Menlo, Monaco, monospace; }
    .tm-dot { width: 8px; height: 8px; border-radius: 50%; background: #484f58; flex: none; }
    .tm-dot.on { background: #3fb950; }
    .tm-acts { margin-left: auto; display: flex; gap: 10px; color: #8b949e; }
    .tm-acts svg { width: 13px; height: 13px; }
    .tm-sess { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 22px; border-radius: 6px; }
    .tm-sess.cur, .tm-win.cur { background: rgba(56, 139, 253, 0.1); }
    .tm-sess.cur .tm-name { color: #58a6ff; }
    .tm-sess > div { min-width: 0; flex: 1; }
    .tm-name { font-weight: 500; }
    .tm-meta { color: #8b949e; font-size: 11px; font-family: Menlo, Monaco, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tm-state { font-size: 10.5px; font-weight: 500; padding: 1px 7px; border-radius: 999px; white-space: nowrap; border: 1px solid; }
    .tm-state.work { color: #58a6ff; border-color: rgba(88,166,255,.4); }
    .tm-state.ask { color: #d29922; border-color: rgba(210,153,34,.4); }
    .tm-state.done { color: #3fb950; border-color: rgba(63,185,80,.4); }
    .tm-win { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 6px; }
    .tm-app {
      flex: none; width: 28px; height: 28px; display: grid; place-items: center; color: #c9d1d9;
      background: #21262d; border: 1px solid #30363d; border-radius: 7px;
    }
    .tour-mock .tm-app svg { width: 15px; height: 15px; }
    .tm-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
    .tm-cell { display: grid; justify-items: center; gap: 6px; padding: 10px 2px 8px; font-size: 11px; color: #c9d1d9; }
    .tm-cell .tm-app { width: 38px; height: 38px; border-radius: 9px; }
    .tour-mock .tm-cell .tm-app svg { width: 18px; height: 18px; }
    .tm-hosthead { padding: 2px 2px 8px; }
    .tm-meter { padding: 3px 2px; }
    .tm-meter > div { display: flex; justify-content: space-between; font-size: 11px; color: #8b949e; }
    .tm-meter b { color: #e6edf3; font-weight: 600; }
    .tm-meter i { display: block; height: 3px; margin-top: 3px; border-radius: 2px; background: linear-gradient(90deg, #3fb950 var(--v), #21262d var(--v)); }
    .tm-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 8px; padding: 6px;
      background: #21262d; border: 1px solid #30363d; border-radius: 6px; font-size: 12px;
    }
    .tm-own { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 10px; color: #3fb950; font-size: 12px; }

    /* Phones: the card is a sheet pinned to whichever edge the target is not
       near, so it never covers what it is pointing at. */
    @media (max-width: 560px) {
      .tour-card, .tour-card.hero { width: auto; left: 12px !important; right: 12px; }
      .tour-card.hero .tour-in { padding: 24px 20px 20px; }
      .tour-card.hero .tour-title { font-size: 26px; }
      .tour-arrow { display: none; }
      .tm-sess, .tm-win { padding-top: 5px; padding-bottom: 5px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .tour-ring, .tour-card, .tour-arrow, .tour-card .tour-bar i { transition: none; }
      .tour-figbody *, .tour-done-check * { animation: none !important; }
      .tour-figbody .typed { width: 11ch; }
      .tour-figbody .out { opacity: 1; }
      .tour-done-check .arc, .tour-done-check path { stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>
  <header>
    <h1><span>re</span>minal</h1>
    <div id="session-form">
      <details id="recents">
        <summary><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>Machines<span class="caret">▾</span></summary>
        <div class="recents-list">
          <div class="ms-bar"><input id="machines-search" class="panel-search is-idle" type="search" placeholder="Search machines &amp; sessions…" autocomplete="off" spellcheck="false"><button id="alerts-bar-btn" class="al-barbtn" type="button" title="Alerts" aria-label="Alerts"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button></div>
          <div id="machines-list"></div>
          <div id="recents-list"></div>
          <div id="machines-nomatch" class="windows-note filter-hide">Nothing matches that.</div>
        </div>
      </details>
      <details id="windows" title="View & control a window on the host">
        <summary><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>Windows<span class="caret">▾</span></summary>
        <div class="recents-list" id="windows-list"></div>
      </details>
      <details id="apps" title="Launch an app on the host">
        <summary><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>Apps<span class="caret">▾</span></summary>
        <div class="recents-list" id="apps-list"></div>
      </details>
      <details id="host" title="Info about the host computer">
        <summary><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="1.5"/><path d="M8 21h8M12 17v4"/></svg>Host<span class="caret">▾</span></summary>
        <div class="recents-list" id="host-list"><div class="recents-empty">Connect to a session to see host stats.</div></div>
      </details>
      <input id="session-input" placeholder="Session" maxlength="8" autocomplete="off" spellcheck="false">
      <input id="pin-input" placeholder="PIN" maxlength="8" inputmode="numeric" autocomplete="off" spellcheck="false">
      <button id="connect-btn">Connect</button>
      <button id="share-btn" title="Show join URL + QR for this session">Share</button>
    </div>
    <div id="status" class="">Session + PIN required</div>
  </header>
  <script data-build="header"></script>
  <div id="terminal-wrap">
    <div id="terminal"></div>
    <div id="overlay"><span id="overlay-text">Connecting…</span></div>
    <div id="viewer-notes" aria-live="polite"></div>
    <button id="jump-bottom" title="Jump to bottom">↓ Jump to bottom</button>
    <div id="findbar">
      <input id="find-input" type="search" placeholder="Find in scrollback" autocomplete="off">
      <span class="count" id="find-count"></span>
      <button id="find-prev" title="Previous match (Shift+Enter)">↑</button>
      <button id="find-next" title="Next match (Enter)">↓</button>
      <button id="find-close" title="Close (Esc)">✕</button>
    </div>
  </div>
  <div id="share-modal">
    <div class="share-card">
      <button type="button" id="share-close" title="Close" aria-label="Close">✕</button>
      <div class="share-title">Share this session</div>
      <div id="share-qr"></div>
      <div class="share-rows">
        <div class="share-row">
          <div class="share-row-label">Session</div>
          <div class="share-row-value" id="share-session"></div>
          <button type="button" class="share-copy-one" data-share="session">Copy</button>
        </div>
        <div class="share-row">
          <div class="share-row-label">PIN</div>
          <div class="share-row-value share-pin" id="share-pin"></div>
          <button type="button" class="share-copy-one" data-share="pin">Copy</button>
        </div>
        <div class="share-row">
          <div class="share-row-label">URL</div>
          <div class="share-row-value" id="share-url-text"></div>
          <button type="button" class="share-copy-one" data-share="url">Copy</button>
        </div>
      </div>
      <div class="share-actions share-msgs">
        <button type="button" id="share-copy-human">Copy for a person</button>
        <button type="button" id="share-copy-agent">Copy for an AI agent</button>
      </div>
      <div class="share-actions">
        <button type="button" id="share-native">Share via…</button>
      </div>
      <div class="share-hint">Anyone with these details joins the same shell. Multiple viewers can be connected at once.</div>
    </div>
  </div>
  <div id="preview">
    <div class="frame" id="preview-frame"></div>
    <div class="meta" id="preview-meta"></div>
    <div class="actions">
      <button id="preview-save" class="primary">Save</button>
      <button id="preview-close">Close</button>
    </div>
  </div>
  <!-- Mobile text-selection grips + copy bar. Fixed-position, hidden until a
       long-press on the terminal starts a selection (see initTouchSelection). -->
  <div class="sel-handle" id="sel-handle-start"></div>
  <div class="sel-handle" id="sel-handle-end"></div>
  <div id="sel-toolbar">
    <button id="sel-copy">Copy</button>
    <button id="sel-all">Select all</button>
  </div>

  <!-- Host windows open as draggable floating panes appended to <body> at
       runtime (see the pane manager JS). This shared off-screen input captures
       keystrokes for the focused pane and summons the mobile soft keyboard. -->
  <input id="wkey" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-hidden="true">
  <!-- Keybar order optimised for mobile shell flow:
       arrows first (used every prompt), then Tab/Esc/Backspace, then
       common Ctrl-* shortcuts in order of frequency, then symbols,
       then UI controls. Arrows + Backspace are marked data-repeat so
       a long press auto-repeats — essential for paging history or
       deleting a line one char at a time. -->
  <div id="sessdock"></div>
  <div id="snipdock"></div>
  <div id="settdock"></div>
  <div id="keybar">
    <button data-key="up" data-repeat title="Previous in history">↑</button>
    <button data-key="down" data-repeat title="Next in history">↓</button>
    <button data-key="left" data-repeat title="Cursor left">←</button>
    <button data-key="right" data-repeat title="Cursor right">→</button>
    <button data-key="tab">Tab</button>
    <button data-key="esc">Esc</button>
    <button data-key="backspace" data-repeat title="Backspace">⌫</button>
    <button data-key="ctrl-c" title="Interrupt">^C</button>
    <button data-key="ctrl-d" title="EOF / logout">^D</button>
    <button data-key="ctrl-r" title="Reverse history search">^R</button>
    <button data-key="ctrl-a" title="Start of line">^A</button>
    <button data-key="ctrl-e" title="End of line">^E</button>
    <button data-key="ctrl-u" title="Clear line">^U</button>
    <button data-key="ctrl-w" title="Delete word back">^W</button>
    <button data-key="ctrl-k" title="Kill to end of line">^K</button>
    <button data-key="ctrl-z" title="Suspend">^Z</button>
    <button data-key="ctrl-l" title="Clear screen">^L</button>
    <button data-key="ctrl-o" title="Ctrl-O — expand output in Claude Code, save in nano">^O</button>
    <button data-key="pipe">|</button>
    <button data-key="tilde">~</button>
    <button id="kb-focus-btn" title="Show keyboard">⌨</button>
    <button id="font-down-btn" title="Smaller font">A−</button>
    <button id="font-up-btn" title="Larger font">A+</button>
    <button id="copy-btn" title="Copy selection to clipboard">Copy</button>
    <button id="paste-btn" title="Paste from clipboard">Paste</button>
    <button id="find-btn" title="Search scrollback">Find</button>
    <button id="upload-btn" title="Upload file to host's ~/Downloads/reminal/">⇪ Upload</button>
    <input type="file" id="upload-input" multiple style="display:none">
    <button id="settings-btn" title="Settings">⚙</button>
    <button id="snip-btn" title="Snippets — drag up to paste, tap to manage">✂</button>
    <button id="keybar-toggle" title="Hide / show the key bar">≡</button>
  </div>

  <div class="cl-back" id="clback" hidden></div>
  <div class="cl-sheet" id="clsheet" role="dialog" aria-modal="true" aria-label="What's new" hidden></div>
  <div class="cl-back" id="alback" hidden></div>
  <div class="cl-sheet al-sheet" id="alsheet" role="dialog" aria-modal="true" aria-label="Alerts" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js" integrity="sha384-J4qzUjBl1FxyLsl/kQPQIOeINsmp17OHYXDOMpMxlKX53ZfYsL+aWHpgArvOuof9" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-search@0.15.0/lib/addon-search.min.js" integrity="sha384-rZV6rh0SoMasxn3Q4xrTEgBKArJ47qXr2bxeT0S4mf6sqQCkvv99FnFKawCQUqUR" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha384-3zSEDfvllQohrq0PHL1fOXJuC/jSOO34H46t6UQfobFOmxE5BpjjaIJY5F2/bMnU" crossorigin="anonymous"></script>
  <script data-build="app"></script>
</body>
</html>
