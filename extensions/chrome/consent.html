<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>reminal: allow browser use?</title><link rel="stylesheet" href="style.css"></head>
<body>
<main>
  <h1>Allow an agent to use your browser?</h1>
  <p id="who"></p>
  <p class="dim">It works only in its own tab group, and can open pages, read them, click and type, but never into a password or payment field. It stops at sign-in forms and CAPTCHAs for you. Stop it any time from the reminal button.</p>
  <div class="row">
    <button id="deny" disabled>Deny</button>
    <button id="allow" class="go" disabled>Allow for this session</button>
  </div>
</main>
<script src="consent.js"></script>
</body>
</html>
