name: replayd probe
on:
  push:
    branches: [public/replayd-probe]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: swiftc -O -o reminal-capture native/reminal-capture/main.swift
      - run: bash scripts/replayd-probe/resp.sh ./reminal-capture
